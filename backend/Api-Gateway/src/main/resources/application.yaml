server:
  port: 8080

spring:
  codec:
    max-in-memory-size: 10MB

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/users/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/products/**

        - id: product-service-images
          uri: http://product-service:8082
          predicates:
            - Path=/images/**

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/orders/**