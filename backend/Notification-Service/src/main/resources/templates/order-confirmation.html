<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .wrapper { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 36px 32px; text-align: center; }
        .header h1 { color: #fff; font-size: 24px; margin: 0; }
        .header p { color: rgba(255,255,255,0.8); margin: 8px 0 0; font-size: 14px; }
        .body { padding: 32px; }
        .body p { color: #555; font-size: 15px; line-height: 1.6; }
        .order-box { background: #f7f7ff; border: 1px solid #e0e0ff; border-radius: 12px; padding: 20px 24px; margin: 24px 0; }
        .order-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ececff; font-size: 14px; }
        .order-row:last-child { border-bottom: none; }
        .order-row span:first-child { color: #888; font-weight: 500; }
        .order-row span:last-child { color: #1a1a2e; font-weight: 600; }
        .status { display: inline-block; background: #d1fae5; color: #065f46; border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 600; }
        .footer { background: #f7f7ff; padding: 20px 32px; text-align: center; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>🎉 Order Confirmed!</h1>
        <p>Thank you for your purchase</p>
    </div>
    <div class="body">
        <p>Hello,<br/>Your order has been successfully placed. Here are your order details:</p>
        <div class="order-box">
            <div class="order-row">
                <span>Product ID</span>
                <span th:text="'#' + ${productId}"></span>
            </div>
            <div class="order-row">
                <span>Quantity</span>
                <span th:text="${quantity} + ' items'"></span>
            </div>
            <div class="order-row">
                <span>Status</span>
                <span><span class="status">CREATED</span></span>
            </div>
        </div>
        <p>If you have any questions, feel free to contact our support team.</p>
    </div>
    <div class="footer">
        © 2025 Your Shop. All rights reserved.
    </div>
</div>
</body>
</html>
