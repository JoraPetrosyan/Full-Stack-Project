<div class="container">
  <app-navbar></app-navbar>

  <div class="page-header">
    <h2>Products</h2>
    <button class="btn-primary" routerLink="/products/add">+ Add Product</button>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Image</th>
      <th>Name</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let product of products">
      <td>
        <span class="badge">#{{ product.id }}</span>
      </td>

      <td>
        <img
          *ngIf="product.imageUrl"
          [src]="'http://localhost:8080' + product.imageUrl"
          class="table-img"
          alt="Product Image">
        <span *ngIf="!product.imageUrl" class="no-img">—</span>
      </td>

      <td>{{ product.name }}</td>
      <td>${{ product.price }}</td>

      <td>
        <span class="status" [class.low-stock]="product.stock < 5">
          {{ product.stock }}
        </span>
      </td>

      <td>
        <div class="actions">
          <button class="btn-sm" (click)="selectProduct(product.id)">View</button>
          <button class="btn-sm" (click)="startEdit(product)">Edit</button>
          <button class="btn-sm btn-danger" (click)="openDelete(product.id)">Delete</button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="page === 0">← Prev</button>
    <span>Page {{ page + 1 }} of {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page === totalPages - 1">Next →</button>
  </div>

  <div *ngIf="showEditModal" class="modal-overlay" (click)="closeModal()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <button class="modal-close" (click)="closeModal()">✕</button>
      <h3>Edit Product</h3>
      <div class="form-grid">
        <div class="field full-width">
          <label>Name</label>
          <input type="text" [(ngModel)]="form.name" />
        </div>
        <div class="field">
          <label>Price</label>
          <input type="number" [(ngModel)]="form.price" />
        </div>
        <div class="field">
          <label>Stock</label>
          <input type="number" [(ngModel)]="form.stock" />
        </div>
        <div class="field full-width">
          <label>Image</label>
          <div class="upload-area" (click)="fileInput.click()">
            <img *ngIf="previewUrl" [src]="previewUrl" class="preview-img" />
            <div *ngIf="!previewUrl" class="upload-placeholder">
              <span>Click to upload image</span>
            </div>
            <input #fileInput type="file" accept="image/*" (change)="onFileChanged($event)" hidden />
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" (click)="save()">Update</button>
        <button class="btn-outline" (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div *ngIf="showDeleteModal" class="modal-overlay" (click)="cancelDelete()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <h3>Delete Product</h3>
      <p>Are you sure you want to delete this product?</p>
      <div class="modal-actions">
        <button class="btn-danger-outline" (click)="confirmDelete()">Delete</button>
        <button class="btn-outline" (click)="cancelDelete()">Cancel</button>
      </div>
    </div>
  </div>

</div>
