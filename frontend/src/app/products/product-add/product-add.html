<div class="container">
  <app-navbar></app-navbar>
  <div class="page-header">
    <h2>Add Product</h2>
  </div>

  <div class="card form-card">
    <div class="form-grid">
      <div class="field">
        <label>Name</label>
        <input [(ngModel)]="product.name" placeholder="Product name" type="text" />
      </div>
      <div class="field">
        <label>Price</label>
        <input [(ngModel)]="product.price" placeholder="0.00" type="number" />
      </div>
      <div class="field">
        <label>Stock</label>
        <input [(ngModel)]="product.stock" placeholder="0" type="number" />
      </div>

      <div class="field full-width">
        <label>Image</label>
        <div class="upload-area" (click)="fileInput.click()">
          <img *ngIf="previewUrl" [src]="previewUrl" class="preview-img" />
          <div *ngIf="!previewUrl" class="upload-placeholder">
            <span>Click to upload image</span>
          </div>
          <input #fileInput type="file" accept="image/*" (change)="onFileChanged($event)" hidden />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-primary" (click)="save()">Save</button>
      <button class="btn-outline" routerLink="/products">Cancel</button>
    </div>
  </div>
</div>
